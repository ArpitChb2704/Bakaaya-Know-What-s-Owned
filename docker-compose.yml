version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bakaaya
    ports:
      - "5432:5432"
    volumes:
      - bakaaya_db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/bakaaya
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  bakaaya_db_data:
